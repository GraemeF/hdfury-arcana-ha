name: Release

# Publishes the release that a merged release pull request describes.
# docs/releasing.md describes the release process.

on:
  push:
    branches: [main]
    paths:
      - custom_components/hdfury_arcana/manifest.json

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the release from the manifest
        id: release
        run: scripts/release-info.sh >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::notice::$TAG already exists, so this change to the manifest is not a release."
            exit 0
          fi

          args=(--target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" "${args[@]}"
