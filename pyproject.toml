[project]
name = "hdfury-arcana-ha"
version = "0.1.0"
description = "Home Assistant custom integration for HDFury Arcana"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "serialx>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
